name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  yarn-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        directory: [
          'braintree-commercetools-events',
          'braintree-extension',
          'braintree-notifications'
        ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: ${{ matrix.directory }}

      - name: Build project
        run: npm run build
        working-directory: ${{ matrix.directory }}

      - name: Run tests
        run: npm test
        working-directory: ${{ matrix.directory }}

      - name: Run audit
        run: npm audit
        working-directory: ${{ matrix.directory }}
